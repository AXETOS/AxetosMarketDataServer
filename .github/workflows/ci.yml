name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-tests:
    name: SQLite tests · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m compileall -q src tests

  postgres-integration:
    name: PostgreSQL 16 integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: axetos
          POSTGRES_PASSWORD: axetos_test_password
          POSTGRES_DB: axetos_market_data_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axetos -d axetos_market_data_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AXETOS_TEST_POSTGRES_URL: postgresql://axetos:axetos_test_password@127.0.0.1:5432/axetos_market_data_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,postgres]"
      - run: python -m pytest -q tests/test_postgres_integration.py tests/test_v019.py
